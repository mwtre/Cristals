<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MW3 3D Viewer</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a1a;
      font-family: system-ui, -apple-system, sans-serif;
      color: #e0e0e0;
    }
    h1 {
      margin-bottom: 1rem;
      font-weight: 500;
    }
    .embed-wrapper {
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .embed-wrapper iframe {
      display: block;
    }
  </style>
</head>
<body>
  <h1>MW3 3D Viewer</h1>
  <div class="embed-wrapper">
    <iframe
      src="https://app.sloyd.ai/embed/ni8b9qll?width=800&height=600&fullscreen=true&mode=deferred"
      width="800"
      height="600"
      frameborder="0"
      allowfullscreen
    ></iframe>
  </div>
</body>
</html>
